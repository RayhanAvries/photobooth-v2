<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Download Photo | Kidversa Studio</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --purple: #5c2e8a;
      --purple-dark: #4a2372;
      --orange: #f09822;
      --white: #ffffff;
      --gray-50: #fafafa;
      --gray-100: #f5f5f5;
      --gray-200: #e5e5e5;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --gray-900: #111827;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow: 0 4px 16px rgba(0,0,0,0.06);
      --shadow-lg: 0 16px 40px rgba(0,0,0,0.1);
      --radius: 16px;
      --radius-lg: 24px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8f9fb;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      padding: 16px;
    }
    .download-container {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      position: relative;
      overflow: hidden;
    }
    .download-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--purple), var(--orange));
    }
    .logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
      box-shadow: 0 8px 20px rgba(92,46,138,0.15);
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--gray-900);
      letter-spacing: -0.5px;
    }
    h1 span { color: var(--purple); }
    .subtitle {
      font-size: 0.8rem;
      color: var(--gray-500);
      margin-bottom: 16px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .photo-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    #photoImage {
      max-width: 100%;
      max-height: 55vh;
      object-fit: contain;
      border-radius: 8px;
      display: block;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      margin-bottom: 14px;
    }
    .btn {
      flex: 1;
      min-width: 120px;
      padding: 13px 16px;
      border-radius: 60px;
      border: none;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--transition);
      letter-spacing: 0.3px;
    }
    .btn-download {
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      color: white;
      box-shadow: 0 6px 18px rgba(92,46,138,0.25);
    }
    .btn-download:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(92,46,138,0.35); }
    .btn-copy {
      background: var(--white);
      color: var(--purple);
      border: 2px solid var(--purple);
    }
    .btn-copy:hover { background: var(--purple); color: white; }
    .btn:active { transform: scale(0.96); }
    .social-links {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }
    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 60px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.78rem;
      transition: all var(--transition);
    }
    .social-link.instagram {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
      box-shadow: 0 4px 14px rgba(220,39,67,0.2);
    }
    .social-link.instagram:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(220,39,67,0.3); }
    .social-link.website {
      background: var(--gray-100);
      color: var(--gray-700);
      border: 1px solid var(--gray-200);
    }
    .social-link.website:hover { background: var(--gray-200); transform: translateY(-2px); }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-box {
      background: var(--white);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 420px;
      padding: 40px 24px;
      text-align: center;
      position: relative;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
      animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.8rem;
      color: var(--gray-400);
      cursor: pointer;
      transition: color var(--transition);
      line-height: 1;
    }
    .modal-close:hover { color: var(--gray-900); }
    .modal-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: white;
      box-shadow: 0 10px 30px rgba(220,39,67,0.3);
    }
    .modal-box h2 {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--gray-900);
      margin-bottom: 8px;
    }
    .modal-box p {
      font-size: 0.9rem;
      color: var(--gray-500);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn-instagram {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 28px;
      border-radius: 60px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all var(--transition);
      box-shadow: 0 8px 24px rgba(220,39,67,0.3);
    }
    .btn-instagram:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(220,39,67,0.4); }
    @media (max-width: 400px) {
      .download-container { padding: 16px 14px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
      .social-links { flex-direction: column; }
      .social-link { justify-content: center; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="download-container">
    <img src="icon.png" alt="Kidversa Logo" class="logo" onerror="this.style.display='none'">
    <h1>Kidversa <span>Studio</span></h1>
    <p class="subtitle">Your photo is ready</p>
    <div class="photo-wrap">
      <img id="photoImage" src="" alt="Your Photo">
    </div>
    <div class="actions">
      <button class="btn btn-download" id="downloadBtn"><i class="fas fa-download"></i> Download</button>
      <button class="btn btn-copy" id="copyBtn"><i class="fas fa-link"></i> Copy Link</button>
    </div>
    <div class="social-links">
      <a href="https://instagram.com/kidversa" target="_blank" class="social-link instagram" id="instagramLink">
        <i class="fab fa-instagram"></i> Instagram
      </a>
      <a href="https://kidversa.fun" target="_blank" class="social-link website" id="websiteLink">
        <i class="fas fa-globe"></i> Website
      </a>
    </div>
  </div>

  <div class="modal-overlay" id="followModal">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-icon"><i class="fab fa-instagram"></i></div>
      <h2>Follow Kidversa Studio</h2>
      <p>Stay updated with our latest creations and special offers.</p>
      <a href="https://instagram.com/kidversa" target="_blank" class="btn-instagram" id="modalInstagramBtn">
        <i class="fab fa-instagram"></i> Follow @kidversa
      </a>
    </div>
  </div>

  <script>
    const filename = window.location.pathname.split('/').pop();
    let currentPhotoUrl = '';
    let currentDownloadUrl = '';

    async function loadPhoto() {
      try {
        const res = await fetch(`/api/photo/${encodeURIComponent(filename)}`);
        if (!res.ok) throw new Error('Photo not found');
        const photo = await res.json();
        const photoImage = document.getElementById('photoImage');
        photoImage.src = `/photos/${photo.filename}`;
        currentPhotoUrl = `/photos/${photo.filename}`;
        currentDownloadUrl = window.location.origin + `/api/download/${photo.filename}`;
      } catch (err) {
        console.error('Error loading photo:', err);
        document.getElementById('photoImage').alt = 'Photo not found';
      }
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/settings');
        const settings = await res.json();
        const instagramUrl = settings.instagram_url || 'https://instagram.com/kidversa';
        const websiteUrl = settings.website_url || 'https://kidversa.fun';
        document.getElementById('instagramLink').href = instagramUrl;
        document.getElementById('websiteLink').href = websiteUrl;
        document.getElementById('modalInstagramBtn').href = instagramUrl;
      } catch (err) {
        console.error('Error loading settings:', err);
      }
    }

    function showFollowModal() {
      document.getElementById('followModal').classList.add('show');
    }

    function hideFollowModal() {
      document.getElementById('followModal').classList.remove('show');
    }

    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (currentDownloadUrl) {
        const a = document.createElement('a');
        a.href = currentDownloadUrl;
        a.download = `Kidversa_Studio_${filename}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showFollowModal();
      }
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      if (currentPhotoUrl) {
        const fullUrl = window.location.origin + currentPhotoUrl;
        try {
          await navigator.clipboard.writeText(fullUrl);
        } catch (err) {
          const input = document.createElement('input');
          input.value = fullUrl;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
        }
        showFollowModal();
      }
    });

    document.getElementById('modalClose').addEventListener('click', hideFollowModal);
    document.getElementById('followModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) hideFollowModal();
    });

    loadPhoto();
    loadSettings();
  </script>
</body>
</html>
