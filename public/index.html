<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kidversa Studio</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #FFFFFF;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .dot-pattern {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#E2E8F0 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none; z-index: 0;
        }

        .blob {
            position: fixed; border-radius: 50%; filter: blur(80px);
            pointer-events: none; z-index: 0;
            animation: blobMorph 12s infinite ease-in-out;
        }
        .blob-purple {
            width: 350px; height: 350px; background: rgba(92, 46, 138, 0.15);
            top: -100px; right: -80px; animation-delay: 0s;
        }
        .blob-orange {
            width: 300px; height: 300px; background: rgba(240, 152, 34, 0.12);
            bottom: -80px; left: -60px; animation-delay: -4s; animation-duration: 15s;
        }
        .blob-purple-sm {
            width: 200px; height: 200px; background: rgba(92, 46, 138, 0.1);
            top: 50%; left: 70%; animation-delay: -8s; animation-duration: 10s;
        }

        @keyframes blobMorph {
            0%, 100% { transform: translate(0, 0) scale(1); border-radius: 40% 60% 60% 40% / 60% 30% 70% 40%; }
            25% { transform: translate(40px, -30px) scale(1.15); border-radius: 60% 40% 30% 70% / 40% 60% 30% 70%; }
            50% { transform: translate(-20px, 40px) scale(0.9); border-radius: 30% 70% 50% 50% / 50% 40% 60% 50%; }
            75% { transform: translate(-40px, -20px) scale(1.1); border-radius: 50% 50% 40% 60% / 30% 60% 40% 70%; }
        }

        .scene {
            position: relative; z-index: 1;
            width: 100%; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 35px; padding: 20px;
        }

        /* Admin gear icon */
        .admin-link {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #9CA3AF;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .admin-link:hover {
            color: #5c2e8a;
            transform: rotate(90deg) scale(1.1);
            box-shadow: 0 4px 20px rgba(92,46,138,0.2);
            border-color: rgba(92,46,138,0.2);
        }

        .admin-link span { display: none; }
        .admin-tooltip {
            position: fixed;
            top: 72px;
            right: 20px;
            z-index: 10;
            background: #1F2937;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .admin-link:hover + .admin-tooltip { opacity: 1; }

        .logo-stage { position: relative; width: 140px; height: 140px; }
        .logo-ring {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%; border: 2px dashed rgba(92, 46, 138, 0.25);
            animation: ringSpin 15s linear infinite;
        }
        .logo-ring:nth-child(1) { width: 165px; height: 165px; }
        .logo-ring:nth-child(2) { width: 195px; height: 195px; border-color: rgba(240, 152, 34, 0.3); animation-duration: 20s; animation-direction: reverse; }
        .logo-ring:nth-child(3) { width: 225px; height: 225px; border-color: rgba(92, 46, 138, 0.15); border-style: solid; animation-duration: 25s; }
        .logo-dot {
            position: absolute; width: 6px; height: 6px; border-radius: 50%;
            top: -3px; left: 50%; transform: translateX(-50%);
        }
        .logo-ring:nth-child(1) .logo-dot { background: #5c2e8a; box-shadow: 0 0 12px #5c2e8a; }
        .logo-ring:nth-child(2) .logo-dot { background: #f09822; box-shadow: 0 0 12px #f09822; }
        .logo-ring:nth-child(3) .logo-dot { background: #4a2372; box-shadow: 0 0 12px #4a2372; }

        @keyframes ringSpin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .logo-core {
            position: relative; width: 140px; height: 140px; z-index: 3;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .logo-core:hover { transform: scale(1.06) translateY(-6px); }
        .logo-img {
            width: 140px; height: 140px; border-radius: 50%; object-fit: contain;
            background: #FFFFFF; padding: 16px; border: 2px solid #F3F4F6;
            transition: all 0.5s ease; box-shadow: 0 10px 40px rgba(92, 46, 138, 0.1);
        }
        .logo-core:hover .logo-img {
            border-color: #5c2e8a;
            box-shadow: 0 20px 60px rgba(92, 46, 138, 0.2), 0 0 0 12px rgba(92, 46, 138, 0.04);
        }
        .logo-fallback {
            display: none; width: 140px; height: 140px; border-radius: 50%;
            background: linear-gradient(135deg, #5c2e8a, #4a2372);
            align-items: center; justify-content: center;
            border: 2px solid #F3F4F6;
            box-shadow: 0 10px 40px rgba(92, 46, 138, 0.15);
            transition: all 0.5s ease;
        }
        .logo-core:hover .logo-fallback {
            border-color: #f09822;
            box-shadow: 0 20px 60px rgba(92, 46, 138, 0.25), 0 0 0 12px rgba(240, 152, 34, 0.08);
        }
        .logo-fallback i { font-size: 3.5rem; color: #FFFFFF; }

        .brand-block { text-align: center; }
        .brand-title {
            font-size: clamp(2.2rem, 5vw, 3rem); font-weight: 800;
            color: #1F2937; letter-spacing: -2px; line-height: 1.1;
            transition: letter-spacing 0.4s ease;
        }
        .brand-title:hover { letter-spacing: 0px; }
        .brand-title .accent { color: #5c2e8a; position: relative; display: inline-block; }
        .brand-title .accent::after {
            content: ''; position: absolute; bottom: 4px; left: 0;
            width: 100%; height: 6px; background: rgba(240, 152, 34, 0.4);
            border-radius: 3px; z-index: -1; transition: height 0.3s ease;
        }
        .brand-title:hover .accent::after { height: 10px; }
        .brand-sub {
            font-size: 0.85rem; font-weight: 600; color: #9CA3AF;
            letter-spacing: 6px; text-transform: uppercase; margin-top: 6px;
            transition: all 0.4s ease;
        }
        .brand-sub:hover { color: #5c2e8a; letter-spacing: 8px; }

        .btn-trigger {
            position: relative; display: inline-flex; align-items: center; justify-content: center;
            gap: 12px; padding: 19px 52px; background: #5c2e8a; color: #FFFFFF;
            border: none; border-radius: 60px; font-size: 1rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase; cursor: pointer; text-decoration: none;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            overflow: hidden; box-shadow: 0 8px 30px rgba(92, 46, 138, 0.25);
        }
        .btn-trigger::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, #4a2372, #5c2e8a, #f09822);
            opacity: 0; transition: opacity 0.4s ease; border-radius: 60px; z-index: -1;
        }
        .btn-trigger:hover::before { opacity: 1; }
        .btn-trigger:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(92, 46, 138, 0.35), 0 0 0 16px rgba(240, 152, 34, 0.06);
            gap: 18px;
        }
        .btn-trigger:active {
            transform: scale(0.94); transition: all 0.1s ease;
            box-shadow: 0 6px 20px rgba(92, 46, 138, 0.3);
        }
        .btn-trigger .btn-icon { font-size: 1.2rem; transition: all 0.4s ease; }
        .btn-trigger:hover .btn-icon { transform: rotate(-12deg) scale(1.2); }
        .btn-trigger .btn-arrow { transition: all 0.4s ease; opacity: 0.7; }
        .btn-trigger:hover .btn-arrow { opacity: 1; transform: translateX(5px); }

        .btn-ripple {
            position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.5);
            transform: scale(0); animation: rippleOut 0.7s ease-out; pointer-events: none;
        }
        @keyframes rippleOut { to { transform: scale(4); opacity: 0; } }

        .tag-row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .tag {
            font-size: 0.75rem; font-weight: 600; color: #9CA3AF;
            letter-spacing: 3px; text-transform: uppercase; padding: 10px 20px;
            border-radius: 40px; background: #F9FAFB; cursor: default;
            transition: all 0.4s ease; border: 1px solid transparent;
        }
        .tag:hover {
            color: #5c2e8a; background: #FFFFFF; border-color: #E2E8F0;
            transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
        }
        .tag:nth-child(2):hover { color: #f09822; border-color: #FDE68A; }
        .tag:nth-child(3):hover { color: #4a2372; border-color: #C4B5FD; }

        @media (max-width: 480px) {
            .scene { gap: 28px; }
            .logo-stage { width: 115px; height: 115px; }
            .logo-img, .logo-fallback { width: 115px; height: 115px; padding: 14px; }
            .logo-ring:nth-child(1) { width: 140px; height: 140px; }
            .logo-ring:nth-child(2) { width: 165px; height: 165px; }
            .logo-ring:nth-child(3) { width: 190px; height: 190px; }
            .btn-trigger { padding: 17px 42px; font-size: 0.9rem; letter-spacing: 1px; gap: 10px; }
            .tag { font-size: 0.7rem; letter-spacing: 2px; padding: 8px 16px; }
            .brand-sub { letter-spacing: 5px; }
        }
    </style>
</head>
<body>
    <div class="dot-pattern"></div>
    <div class="blob blob-purple"></div>
    <div class="blob blob-orange"></div>
    <div class="blob blob-purple-sm"></div>

    <!-- Admin Settings Link -->
    <a href="/admin" class="admin-link" title="Settings">
        <i class="fas fa-cog"></i>
        <span>Admin</span>
    </a>
    <div class="admin-tooltip">Admin Settings</div>

    <div class="scene">
        <div class="logo-stage">
            <div class="logo-ring"><span class="logo-dot"></span></div>
            <div class="logo-ring"><span class="logo-dot"></span></div>
            <div class="logo-ring"><span class="logo-dot"></span></div>
            <div class="logo-core">
                <img src="logo.png" alt="Kidversa Studio Logo" class="logo-img"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="logo-fallback"><i class="fas fa-star"></i></div>
            </div>
        </div>

        <div class="brand-block">
            <h1 class="brand-title">Kidversa <span class="accent">Studio</span></h1>
            <p class="brand-sub">Creative Visuals</p>
        </div>

        <a href="/booth" class="btn-trigger" id="startButton">Start Capture</a>
    </div>

    <script>
        (function() {
            const startButton = document.getElementById('startButton');

            // ===== BACKGROUND MUSIC AUTO PLAY LOOP =====
            let backgroundAudio = null;

            async function getBackgroundMusicUrl() {
                try {
                    const res = await fetch('/api/settings');
                    const settings = await res.json();
                    const filename = settings.background_music;
                    if (!filename) return null;
                    return `/music/${filename}`;
                } catch (err) {
                    console.warn('Gagal mengambil background music:', err);
                    return null;
                }
            }

            async function initBackgroundMusic() {
                const url = await getBackgroundMusicUrl();
                if (!url) return;

                backgroundAudio = new Audio(url);
                backgroundAudio.loop = true;
                backgroundAudio.volume = 0.5;

                // Coba autoplay
                try {
                    await backgroundAudio.play();
                } catch (err) {
                    // Autoplay diblokir, coba lagi saat user berinteraksi
                    const tryPlay = () => {
                        if (backgroundAudio) {
                            backgroundAudio.play().catch(() => {});
                        }
                        document.removeEventListener('click', tryPlay);
                        document.removeEventListener('touchstart', tryPlay);
                    };
                    document.addEventListener('click', tryPlay);
                    document.addEventListener('touchstart', tryPlay);
                }

                // Pastikan loop berjalan terus
                backgroundAudio.addEventListener('ended', () => {
                    if (backgroundAudio && backgroundAudio.loop) {
                        backgroundAudio.play().catch(() => {});
                    }
                });
            }

            // Mulai musik setelah halaman dimuat
            initBackgroundMusic();

            // ===== TOMBOL START CAPTURE =====
            startButton.addEventListener('click', function(e) {
                e.preventDefault();

                // Buat ripple
                const rect = this.getBoundingClientRect();
                const ripple = document.createElement('span');
                ripple.classList.add('btn-ripple');
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : rect.left + rect.width / 2);
                const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : rect.top + rect.height / 2);
                ripple.style.left = (clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (clientY - rect.top - size / 2) + 'px';
                this.appendChild(ripple);

                // Hentikan musik sebelum pindah halaman
                if (backgroundAudio) {
                    backgroundAudio.pause();
                    backgroundAudio.currentTime = 0;
                }

                setTimeout(() => {
                    ripple.remove();
                    window.location.href = '/booth';
                }, 350);
            });

            // Haptic feedback
            if (navigator.vibrate) {
                startButton.addEventListener('touchstart', function() {
                    navigator.vibrate(8);
                }, { passive: true });
            }

            // Cegah double click
            document.addEventListener('dblclick', function(e) {
                if (e.target.closest('.btn-trigger, .tag')) {
                    e.preventDefault();
                }
            }, { passive: false });

            // Set height untuk mobile
            function setAppHeight() {
                document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
            }
            window.addEventListener('resize', setAppHeight);
            setAppHeight();

        })();
    </script>
</body>
</html>
